<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d70">
<title>Новость — Купинский район</title>
<style>
:root{--blue:#123d70;--blue2:#1768ad;--ink:#172536;--muted:#657487;--line:#dce5ee}
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:16px/1.6 Arial,sans-serif}a{color:var(--blue2);text-decoration:none}.wrap{max-width:850px;margin:auto;padding:0 15px}.top{background:#0d2e55;color:#dbeaff;padding:8px 15px;font-size:12px}.brand{background:white;border-bottom:1px solid var(--line);padding:18px 0}.brand h1{margin:0;color:var(--blue);font-size:clamp(22px,5vw,30px)}main{padding:24px 0 48px}.back{display:inline-block;margin-bottom:18px;font-weight:bold}.article{background:white;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px)}.cat{color:var(--blue2);font-size:12px;font-weight:bold;text-transform:uppercase}.date{color:var(--muted);font-size:13px;margin:8px 0 18px}.article h2{font-size:clamp(24px,5vw,34px);line-height:1.2;color:var(--blue);margin:8px 0}.body{font-size:17px;line-height:1.75;white-space:pre-wrap}.source{margin-top:25px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}.source a{font-weight:bold}.notice{background:#edf5fc;border-radius:9px;padding:13px;margin-top:18px;font-size:13px;color:#53657a}.empty{background:white;border:1px dashed #b9c9d8;border-radius:12px;padding:22px;color:var(--muted)}footer{background:#102f54;color:#d8e6f5;padding:22px 0;font-size:12px}
</style>
</head>
<body>
<div class="top">НОВОСТНОЙ ПОРТАЛ · КУПИНСКИЙ РАЙОН · НОВОСИБИРСКАЯ ОБЛАСТЬ</div>
<header class="brand"><div class="wrap"><a href="./"><h1>Купинский район — Новости</h1></a></div></header>
<main class="wrap"><a class="back" href="./">← Все новости</a><div id="article" class="empty">Загружаем публикацию…</div></main>
<footer><div class="wrap">© 2026 · Купинский район — Новости</div></footer>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
fetch('./data/news.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('feed');return r.json()}).then(items=>{
 const n=items.find(x=>x.id===id),root=document.getElementById('article');
 if(!n){root.textContent='Эта публикация не найдена. Возможно, лента уже обновилась.';return}
 const date=n.published_at?new Date(n.published_at).toLocaleString('ru-RU'):'Дата не указана';
 document.title=n.title+' — Купинский район';
 root.className='article';
 root.innerHTML='<div class="cat">'+esc(n.category||'Район')+'</div><h2>'+esc(n.title)+'</h2><div class="date">'+esc(date)+'</div><div class="body">'+esc(n.summary||'Краткий анонс этой публикации пока не предоставлен источником.')+'</div><div class="source">Источник: '+esc(n.source||'Внешняя публикация')+'<p><a href="'+esc(n.url)+'" target="_self">Открыть первоисточник ↗</a></p></div><div class="notice">На этой странице размещён краткий анонс и ссылка на первоисточник. Полный материал принадлежит его издателю.</div>';
}).catch(()=>{document.getElementById('article').textContent='Не удалось загрузить публикацию. Проверьте подключение к интернету.'});
</script>
</body></html>
